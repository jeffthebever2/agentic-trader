# ╔══════════════════════════════════════════════════════════════════╗
# ║            CodeQL Advanced Security Workflow v2                 ║
# ║  Copilot Autofix • Extended Queries • Security Gate             ║
# ║  Verified against codeql-action v4 action.yml source           ║
# ╚══════════════════════════════════════════════════════════════════╝

name: "CodeQL Advanced + Copilot Autofix"

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master", "develop" ]
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly full scan — Monday 14:23 UTC
    - cron: '23 14 * * 1'
  workflow_dispatch:
    inputs:
      query_suite:
        description: 'Query suite to run'
        required: false
        default: 'security-and-quality'
        type: choice
        options:
          - security-extended
          - security-and-quality
          - security-experimental

# Cancel stale runs on new push to the same branch
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. DETECT — Auto-detect CodeQL-supported languages in the repo
  # ──────────────────────────────────────────────────────────────────
  detect-languages:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-detect CodeQL-supported languages
        id: detect
        run: |
          LANGUAGES=()

          if git ls-files | grep -qE '\.(py|pyw)$'; then
            LANGUAGES+=('{"language":"python","build-mode":"none"}')
          fi
          if git ls-files | grep -qE '\.(js|mjs|cjs|ts|tsx|jsx)$'; then
            LANGUAGES+=('{"language":"javascript-typescript","build-mode":"none"}')
          fi
          if git ls-files | grep -qE '\.rb$'; then
            LANGUAGES+=('{"language":"ruby","build-mode":"none"}')
          fi
          if git ls-files | grep -qE '\.go$'; then
            LANGUAGES+=('{"language":"go","build-mode":"autobuild"}')
          fi
          if git ls-files | grep -qE '\.(java|kt|kts)$'; then
            LANGUAGES+=('{"language":"java-kotlin","build-mode":"autobuild"}')
          fi
          if git ls-files | grep -qE '\.(c|cpp|cc|cxx|h|hpp)$'; then
            LANGUAGES+=('{"language":"c-cpp","build-mode":"autobuild"}')
          fi
          if git ls-files | grep -qE '\.rs$'; then
            LANGUAGES+=('{"language":"rust","build-mode":"none"}')
          fi
          if git ls-files | grep -qE '\.swift$'; then
            LANGUAGES+=('{"language":"swift","build-mode":"autobuild"}')
          fi
          if git ls-files | grep -qE '\.(cs|csx)$'; then
            LANGUAGES+=('{"language":"csharp","build-mode":"autobuild"}')
          fi
          # Always include Actions analysis if workflows exist
          if git ls-files | grep -qE '\.github/workflows/.*\.ya?ml$'; then
            LANGUAGES+=('{"language":"actions","build-mode":"none"}')
          fi

          if [ ${#LANGUAGES[@]} -eq 0 ]; then
            MATRIX='{"include":[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]}'
          else
            JOINED=$(IFS=,; echo "${LANGUAGES[*]}")
            MATRIX="{\"include\":[$JOINED]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Detected matrix: $MATRIX"

  # ──────────────────────────────────────────────────────────────────
  # 2. ANALYZE — CodeQL scan (all detected languages, in parallel)
  # ──────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      security-events: write   # Upload SARIF results
      packages: read            # Pull private CodeQL packs
      actions: read             # Read workflow metadata
      contents: read            # Checkout code
      pull-requests: write      # Copilot Autofix posts fix suggestions on PRs

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── Python setup ──────────────────────────────────────────────
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi

      # ── Node.js setup ─────────────────────────────────────────────
      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Node.js dependencies (skipped if no lock file)
        if: matrix.language == 'javascript-typescript'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --ignore-scripts
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts
          else
            echo "No lock file found — skipping dependency install. CodeQL will still scan all source files."
          fi

      # ── CodeQL Init ───────────────────────────────────────────────
      # Valid inputs (verified from codeql-action/init/action.yml source):
      # languages, build-mode, queries, config, config-file, packs, tools,
      # ram, threads, trap-caching, dependency-caching, source-root,
      # registries, external-repository-token, debug, matrix, token
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality = security-extended + code quality checks
          # Covers CWE-79, CWE-89, CWE-78, CWE-22, CWE-502, and 70+ more
          queries: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.query_suite || 'security-and-quality' }}
          # Enable both code scanning and code quality analysis
          analysis-kinds: 'code-scanning,code-quality'
          # Enable caching of build dependencies for faster re-runs
          dependency-caching: true
          # Inline config — paths to ignore, noise filters
          config: |
            paths-ignore:
              - node_modules
              - vendor
              - .venv
              - venv
              - dist
              - build
              - "**/*.min.js"
              - "**/*.bundle.js"
              - "**/*-lock.*"
              - "**/*.lock"
            query-filters:
              - exclude:
                  problem.severity: recommendation

      # ── Autobuild (compiled languages only) ───────────────────────
      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      # ── Manual build placeholder (uncomment if autobuild fails) ───
      # - name: Manual build
      #   if: matrix.build-mode == 'manual'
      #   run: |
      #     make bootstrap && make release

      # ── Perform CodeQL Analysis ───────────────────────────────────
      # Valid inputs (verified from codeql-action/analyze/action.yml source):
      # check_name, output, upload, cleanup-level, ram, add-snippets,
      # skip-queries, threads, checkout_path, ref, sha, category,
      # upload-database, post-processed-sarif-path, wait-for-processing,
      # token, matrix, expect-error
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always        # Always upload SARIF (needed for Copilot Autofix)
          add-snippets: true    # Include code snippets in SARIF for richer Autofix context

      # ── Actions run summary ───────────────────────────────────────
      - name: Generate scan summary
        if: always()
        run: |
          echo "## 🔍 CodeQL Scan — \`${{ matrix.language }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Language | \`${{ matrix.language }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build mode | \`${{ matrix.build-mode }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Query suite | \`security-and-quality\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner OS | \`${{ runner.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔐 [View Security Alerts](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "🤖 Copilot Autofix suggestions appear on open PRs with findings." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────
  # 3. SECURITY GATE — Block PRs that introduce HIGH/CRITICAL alerts
  # ──────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate (Block High/Critical)
    needs: analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      pull-requests: write
    steps:
      - name: Check for HIGH/CRITICAL alerts on this PR
        uses: actions/github-script@v7
        with:
          script: |
            let alerts = [];
            try {
              const response = await github.rest.codeScanning.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
                ref: context.payload.pull_request.head.sha
              });
              alerts = response.data;
            } catch (e) {
              // API may return 404 if code scanning isn't fully set up yet
              core.warning(`Could not fetch alerts: ${e.message}`);
              return;
            }

            const criticals = alerts.filter(a =>
              ['high', 'critical', 'error'].includes(
                (a.rule?.security_severity_level || a.rule?.severity || '').toLowerCase()
              )
            );

            if (criticals.length > 0) {
              const list = criticals.slice(0, 10).map(a =>
                `- **${a.rule?.description || a.rule?.id}** — \`${a.most_recent_instance?.location?.path}:${a.most_recent_instance?.location?.start_line}\``
              ).join('\n');

              const moreCount = criticals.length > 10 ? `\n\n_...and ${criticals.length - 10} more._` : '';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  `## ⛔ Security Gate — ${criticals.length} High/Critical Alert(s) Found`,
                  '',
                  'This PR introduces or exposes the following vulnerabilities:',
                  '',
                  list + moreCount,
                  '',
                  `👉 Visit the [Security tab](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning) — Copilot Autofix has suggested fixes for these alerts.`,
                  '',
                  '_Resolve or dismiss all high/critical alerts before merging._'
                ].join('\n')
              });

              core.setFailed(`❌ Security gate blocked: ${criticals.length} high/critical alert(s) found.`);
            } else {
              core.info('✅ Security gate passed — no high/critical alerts detected.');
            }

  # ──────────────────────────────────────────────────────────────────
  # 4. NOTIFY — Alert team on scheduled scan failures
  # ──────────────────────────────────────────────────────────────────
  notify-on-failure:
    name: Notify on Scan Failure
    needs: analyze
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post failure notification
        run: |
          echo "::warning::CodeQL scheduled scan FAILED for ${{ github.repository }}."
          echo "Add a SLACK_WEBHOOK_URL secret and uncomment the lines below to enable Slack alerts:"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-type: application/json' \
          #   --data "{\"text\":\"⚠️ CodeQL scan failed for *${{ github.repository }}*. <https://github.com/${{ github.repository }}/actions|View run>\"}"
