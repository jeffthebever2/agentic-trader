name: CI
on:
  push:
    branches: [main, master]
  pull_request:

# NOTE: the repo ROOT package.json is the unrelated `ai-orchestrator` CLI. CI must
# NOT run `npm test`/`npm run build` at the root (that was a false-green — it never
# ran the Python tests or built the real UI). The real app is: Python package
# `tradingagents/` + FastAPI `web/` (pytest), and the React UI in `frontend/`.
jobs:
  backend:
    name: Python tests (the real suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-subtests ruff
      - name: Lint (non-blocking style sweep)
        run: ruff check . || true
      - name: Run test suite
        # Unit + smoke only; `integration` needs live brokers/network and is not
        # run in CI. testpaths/pythonpath come from pyproject/pytest config.
        run: pytest -q -m "not integration"

  frontend:
    name: Frontend build (strict tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend      # the REAL UI — not the repo root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build              # tsc -b (strict) + vite build

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
